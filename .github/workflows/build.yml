name: Build and GameTest

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests
        run: ./gradlew build
      - name: Run GameTests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ashen-gametest.log"
          dumps="$RUNNER_TEMP/ashen-gametest-dumps"
          : > "$log"
          setsid bash tools/ci/capture-gametest-hang.sh "$log" "$dumps" &
          watcher=$!
          trap 'kill -- "-$watcher" 2>/dev/null || true; wait "$watcher" 2>/dev/null || true' EXIT
          ./gradlew gameTest 2>&1 | tee "$log"
